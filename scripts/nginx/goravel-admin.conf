# Nginx 负载均衡配置
# 安装位置: /etc/nginx/sites-available/goravel-admin
# 创建软链接: sudo ln -s /etc/nginx/sites-available/goravel-admin /etc/nginx/sites-enabled/
# 测试配置: sudo nginx -t
# 重载配置: sudo nginx -s reload

upstream goravel_backend {
    least_conn;  # 使用最少连接负载均衡算法
    
    # 主实例（当前运行版本）
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    
    # 备用实例（部署新版本时启用）
    # 部署时取消注释，部署完成后注释掉旧端口
    # server 127.0.0.1:3001 max_fails=3 fail_timeout=30s backup;
    
    keepalive 32;  # 保持连接池大小
}

# HTTP 服务器配置
server {
    listen 80;
    server_name api.xuancheng888.top;  # 修改为你的域名
    
    # 如果需要 HTTPS，取消注释以下配置
    # listen 443 ssl http2;
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    
    client_max_body_size 100M;
    
    # 访问日志
    access_log /var/log/nginx/goravel-admin-access.log;
    error_log /var/log/nginx/goravel-admin-error.log;
    
    location / {
        proxy_pass http://goravel_backend;
        
        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 健康检查：自动切换到备用实例
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        
        # 不缓冲响应（用于 SSE 等流式响应）
        proxy_buffering off;
    }
    
    # 健康检查端点（可选）
    location /health {
        access_log off;
        proxy_pass http://goravel_backend;
        proxy_set_header Host $host;
    }
}

