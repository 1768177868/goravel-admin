<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <style>
        .chat-container {
            max-width: 900px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        .register {
            padding: 15px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        .register input, .register button {
            margin: 0 5px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .register button {
            background-color: #2196f3;
            color: white;
            border: none;
            cursor: pointer;
        }
        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background-color: #fff;
        }
        .message {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 4px;
            max-width: 70%;
        }
        .self {
            background-color: #e1f5fe;
            margin-left: auto;
        }
        .other {
            background-color: #f5f5f5;
            border: 1px solid #eee;
        }
        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
        }
        .input-area select, .input-area input, .input-area button {
            margin: 0 5px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #msgContent {
            width: 300px;
        }
        .input-area button {
            background-color: #4caf50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .system-msg {
            text-align: center;
            color: #666;
            margin: 5px 0;
        }
        #leaveGroupBtn {
            background-color: #f44336;
        }
        #currentGroups {
            color: #666;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 身份注册区域 -->
        <div class="register">
            <input type="text" id="username" placeholder="输入用户名（必填）">
            <input type="text" id="groups" placeholder="输入所属群（多个用逗号分隔，如group1,group2）">
            <button id="connectBtn">连接聊天室</button>
        </div>

        <!-- 退群功能区域 -->
        <div class="register" style="border-top: 1px solid #eee; margin-top: -1px;">
            <input type="text" id="leaveGroupInput" placeholder="输入要退出的群ID">
            <button id="leaveGroupBtn">退出群</button>
            <span id="currentGroups">当前所属群：无</span>
        </div>

        <!-- 消息展示区域 -->
        <div class="messages" id="messages"></div>

        <!-- 消息发送区域 -->
        <div class="input-area" id="sendArea" style="display: none;">
            <select id="msgType">
                <option value="all">发送给所有人</option>
                <option value="group">发送给指定群</option>
                <option value="private">发送给指定人</option>
            </select>
            <input type="text" id="recvTarget" placeholder="群ID/用户名（群/私人发送时必填）">
            <input type="text" id="msgContent" placeholder="输入消息内容">
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectTimer = null; // 重连定时器
        const RECONNECT_INTERVAL = 5000; // 重连间隔5秒
        let currentGroups = []; // 本地存储当前群列表

        // DOM元素引用
        const usernameEl = document.getElementById('username');
        const groupsEl = document.getElementById('groups');
        const connectBtn = document.getElementById('connectBtn');
        const leaveGroupInput = document.getElementById('leaveGroupInput');
        const leaveGroupBtn = document.getElementById('leaveGroupBtn');
        const currentGroupsEl = document.getElementById('currentGroups');
        const sendArea = document.getElementById('sendArea');
        const msgTypeEl = document.getElementById('msgType');
        const recvTargetEl = document.getElementById('recvTarget');
        const msgContentEl = document.getElementById('msgContent');
        const sendBtn = document.getElementById('sendBtn');
        const messagesEl = document.getElementById('messages');

        // 连接聊天室（支持重连）
        function connectChat() {
            const username = usernameEl.value.trim();
            if (!username) {
                alert('请输入用户名！');
                return;
            }
            // 解析群列表
            const groups = groupsEl.value.trim() ? groupsEl.value.split(',').map(g => g.trim()) : [];
            currentGroups = groups;
            updateGroupDisplay(); // 更新群列表显示

            // 关闭原有连接
            if (ws) {
                ws.close();
            }

            // 建立新连接
            ws = new WebSocket('ws://localhost:3008/ws/chat');
            ws.onopen = () => {
                clearInterval(reconnectTimer);
                reconnectTimer = null;
                // 发送身份注册消息
                const registerMsg = JSON.stringify({
                    username: username,
                    groups: groups
                });
                ws.send(registerMsg);
                showSystemMsg(`已连接聊天室，用户名：${username}，所属群：${groups.join(',') || '无'}`);
                sendArea.style.display = 'block';
            };

            // 接收消息
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                // 处理系统消息（退群结果）
                if (msg.type === 'system') {
                    showSystemMsg(msg.content, msg.groups ? '#2196f3' : 'red');
                    // 更新本地群列表
                    if (Array.isArray(msg.groups)) {
                        currentGroups = msg.groups;
                        updateGroupDisplay();
                    }
                    return;
                }
                // 处理普通聊天消息
                showMessage(msg);
            };

            // 连接关闭
            ws.onclose = (event) => {
                showSystemMsg(`连接已断开（代码：${event.code}），${RECONNECT_INTERVAL/1000}秒后自动重连...`, 'red');
                sendArea.style.display = 'none';
                // 启动自动重连
                if (!reconnectTimer) {
                    reconnectTimer = setInterval(() => {
                        connectChat();
                    }, RECONNECT_INTERVAL);
                }
            };

            // 连接错误
            ws.onerror = (err) => {
                showSystemMsg(`连接错误：${err.message}`, 'red');
                ws.close();
            };
        }

        // 退群按钮点击事件
        leaveGroupBtn.addEventListener('click', () => {
            const targetGroup = leaveGroupInput.value.trim();
            const username = usernameEl.value.trim();
            if (!targetGroup) {
                alert('请输入要退出的群ID！');
                return;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('请先连接聊天室！');
                return;
            }
            if (!currentGroups.includes(targetGroup)) {
                alert(`你未加入群 ${targetGroup}，无法退出！`);
                leaveGroupInput.value = '';
                return;
            }
            // 发送退群消息
            ws.send(JSON.stringify({
                type: 'leave_group',
                from: username,
                to: targetGroup
            }));
            leaveGroupInput.value = '';
        });

        // 发送聊天消息
        sendBtn.addEventListener('click', sendMessage);
        msgContentEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 绑定连接按钮
        connectBtn.addEventListener('click', connectChat);

        // 发送消息核心逻辑
        function sendMessage() {
            const type = msgTypeEl.value;
            const content = msgContentEl.value.trim();
            const username = usernameEl.value.trim();
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

            const msg = {
                type: type,
                from: username,
                to: recvTargetEl.value.trim(),
                content: content
            };

            ws.send(JSON.stringify(msg));
            msgContentEl.value = '';
        }

        // 展示普通聊天消息
        function showMessage(msg) {
            const isSelf = msg.from === usernameEl.value.trim();
            const msgEl = document.createElement('div');
            msgEl.className = `message ${isSelf ? 'self' : 'other'}`;
            msgEl.innerHTML = `<small style="color: #666;">${msg.from}</small><br>${msg.content}`;
            messagesEl.appendChild(msgEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // 展示系统消息
        function showSystemMsg(text, color = '#666') {
            const msgEl = document.createElement('div');
            msgEl.className = 'system-msg';
            msgEl.style.color = color;
            msgEl.textContent = text;
            messagesEl.appendChild(msgEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // 更新当前群列表显示
        function updateGroupDisplay() {
            currentGroupsEl.textContent = `当前所属群：${currentGroups.join(',') || '无'}`;
        }
    </script>
</body>
</html>
