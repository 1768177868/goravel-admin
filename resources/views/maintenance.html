{{define "maintenance"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统维护中</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            color: #334155;
        }
        .card {
            max-width: 480px;
            padding: 2.5rem 2rem;
            text-align: center;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #0f172a; }
        p { line-height: 1.6; color: #64748b; }
        .code { margin-top: 1.5rem; font-size: 3rem; font-weight: 700; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">503</div>
        <h1>系统维护中</h1>
        <p>我们正在进行升级维护，请稍后再试。</p>
    </div>
</body>
</html>
{{end}}
