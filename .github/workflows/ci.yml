name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 后端 CI（编译 / 集成测试）需 MySQL 等环境，暂无线上/CI 数据库时可跳过。
  # 本地有库后恢复 backend / backend-integration job 即可。

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: html/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Run unit tests
        run: npm run test:run

      - name: Run type check
        run: npm run type-check

      - name: Build frontend
        run: npm run build:ci
