name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build backend
        run: go build ./...

      - name: Vet backend
        run: go vet ./...

      - name: Run backend fast tests
        run: |
          PKGS=$(go list ./... | grep -v '/tests/feature$')
          go test -v -timeout=2m $PKGS

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_KEY: base64:dGVzdC1jaS1hcHAta2V5MTIzNDU2Nzg5MDEyMzQ1Ng==
      JWT_SECRET: ci-test-jwt-secret-please-change-in-production
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: goravel
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: memory
      QUEUE_CONNECTION: sync
      APP_DISABLED_RUNNERS: queue:*,schedule:*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run migrations
        run: go run . artisan migrate

      - name: Run integration tests
        run: go test -v -timeout=2m ./tests/feature/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: html/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Run unit tests
        run: npm run test:run

      - name: Run type check
        run: npm run type-check

      - name: Build frontend
        run: npm run build:ci
