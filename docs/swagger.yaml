      remark:
        description: 备注
        example: 备注信息
        type: string
      status:
        description: 订单状态
        example: pending
        type: string
      updated_at:
        description: 更新时间
        example: "2024-01-01 00:00:00"
        type: string
      user_id:
        description: 用户ID
        example: 1001
        type: integer
    type: object
  admin.OrderUpdateRequest:
    properties:
      remark:
        description: 备注（可选）
        example: 已完成支付
        type: string
      status:
        description: 订单状态（必填）
        example: paid
        type: string
    type: object
  admin.OrderWithDetailsResponse:
    properties:
      details:
        description: 订单详情列表
        items:
          $ref: '#/definitions/admin.OrderDetailResponse'
        type: array
      order:
        allOf:
        - $ref: '#/definitions/admin.OrderResponse'
        description: 订单主信息
    type: object
  admin.PaymentDetailResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/admin.PaymentResponse'
      message:
        type: string
      trace_id:
        type: string
    type: object
  admin.PaymentListData:
    properties:
      data:
        description: 支付记录列表
        items:
          $ref: '#/definitions/admin.PaymentResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  admin.PaymentListResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/admin.PaymentListData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  admin.PaymentMethodDetailResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/admin.PaymentMethodResponse'
      message:
        type: string
      trace_id:
        type: string
    type: object
  admin.PaymentMethodListData:
    properties:
      data:
        description: 列表数据
        items:
          $ref: '#/definitions/admin.PaymentMethodResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  admin.PaymentMethodListResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/admin.PaymentMethodListData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  admin.PaymentMethodResponse:
    properties:
      code:
        description: 代码
        example: wechat
        type: string
      config:
        additionalProperties: {}
        description: 配置（详情接口返回）
        type: object
      created_at:
        description: 创建时间
        example: "2024-01-01 00:00:00"
        type: string
      description:
        description: 描述
        example: 默认支付方式
        type: string
      id:
        description: 支付方式ID
        example: 1
        type: integer
      is_active:
        description: 是否启用
        example: true
        type: boolean
      name:
        description: 名称
        example: 微信支付
        type: string
      sort:
        description: 排序
        example: 10
        type: integer
      type:
        description: 类型
        example: wechat
        type: string
      updated_at:
        description: 更新时间
        example: "2024-01-01 00:00:00"
        type: string
    type: object
  admin.PaymentMethodSimple:
    properties:
      code:
        description: 支付方式代码
        example: wechat
        type: string
      id:
        description: 支付方式ID
        example: 1
        type: integer
      name:
        description: 支付方式名称
        example: 微信支付
        type: string
      type:
        description: 支付类型
        example: wechat
        type: string
    type: object
  admin.PaymentResponse:
    properties:
      amount:
        description: 支付金额
        example: 99.99
        type: number
      created_at:
        description: 创建时间
        example: "2024-01-01 00:00:00"
        type: string
      fail_reason:
        description: 失败原因
        example: ""
        type: string
      id:
        description: 支付记录ID
        example: 1
        type: integer
      order_no:
        description: 订单号
        example: ORD202604090001
        type: string
      pay_time:
        description: 支付时间
        example: "2024-01-01 00:00:00"
        type: string
      payment_method:
        allOf:
        - $ref: '#/definitions/admin.PaymentMethodSimple'
        description: 支付方式信息
      payment_method_id:
        description: 支付方式ID
        example: 1
        type: integer
      payment_no:
        description: 支付单号
        example: PAY202604090001
        type: string
      remark:
        description: 备注
        example: 备注信息
        type: string
      status:
        description: 支付状态
        example: paid
        type: string
      third_party_no:
        description: 第三方单号
        example: WX202604090001
        type: string
      updated_at:
        description: 更新时间
        example: "2024-01-01 00:00:00"
        type: string
      user_id:
        description: 用户ID
        example: 1001
        type: integer
    type: object
  admin.UnbindGoogleAuthRequest:
    properties:
      code:
        description: 当前管理员的谷歌验证码（6位动态码）
        example: "123456"
        type: string
    type: object
  apidoc.Error:
    properties:
      code:
        example: 404
        type: integer
      error_code:
        example: record_not_found
        type: string
      message:
        example: 记录不存在
        type: string
      trace_id:
        example: 01knrfw7dsrxc3dxbbzk6bkv3j
        type: string
    type: object
  apidoc.Success:
    properties:
      code:
        example: 200
        type: integer
      message:
        type: string
      trace_id:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 这是一个基于 Goravel 框架的后台管理系统 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Goravel Admin API
  version: "1.0"
paths:
  /api/admin/admins:
    get:
      consumes:
      - application/json
      description: 分页获取管理员列表
      parameters:
      - default: 1
        description: 页码（从1开始）
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量（建议 10-100）
        in: query
        name: page_size
        type: integer
      - description: 登录用户名（模糊匹配）
        in: query
        name: username
        type: string
      - description: 账号状态（1-启用，0-禁用）
        enum:
        - "0"
        - "1"
        in: query
        name: status
        type: string
      - description: 角色ID（精确匹配）
        in: query
        name: role_id
        type: string
      - description: 部门ID（精确匹配）
        in: query
        name: department_id
        type: string
      - description: 岗位ID（精确匹配）
        in: query
        name: position_id
        type: string
      - description: 是否已绑定2FA（1-已绑定，0-未绑定）
        enum:
        - "0"
        - "1"
        in: query
        name: is_2fa_bound
        type: string
      - description: 创建时间开始（格式：YYYY-MM-DD HH:mm:ss）
        in: query
        name: start_time
        type: string
      - description: 创建时间结束（格式：YYYY-MM-DD HH:mm:ss）
        in: query
        name: end_time
        type: string
      - description: 排序字段（格式：字段:asc/desc，例如：created_at:desc）
        in: query
        name: order_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AdminListResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 获取管理员列表
      tags:
      - 管理员管理
    post:
      consumes:
      - application/json
      description: |-
        创建新的管理员账号（status：1-启用，0-禁用）
        字段说明：username-登录用户名（必填）；password-登录密码（必填）；nickname-显示昵称；email-联系邮箱；phone-联系手机号；department_id-所属部门ID；position_id-所属岗位ID；role_ids-角色ID数组；status-账号状态（1启用/0禁用）
      parameters:
      - description: 创建参数（必填：username、password；可选：nickname、email、phone、department_id、position_id、status、role_ids）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.AdminCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AdminDetailResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 创建管理员
      tags:
      - 管理员管理
  /api/admin/admins/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的管理员账号
      parameters:
      - description: 管理员ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/apidoc.Success'
        "403":
          description: 无权限、受保护管理员不能删除或不能删除自己
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: 管理员不存在
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 删除管理员
      tags:
      - 管理员管理
    get:
      consumes:
      - application/json
      description: 根据ID获取管理员详细信息
      parameters:
      - description: 管理员ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AdminDetailResponse'
        "404":
          description: 管理员不存在
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 获取管理员详情
      tags:
      - 管理员管理
    put:
      consumes:
      - application/json
      description: |-
        更新管理员的基本信息（status：1-启用，0-禁用）
        字段说明：nickname-显示昵称；email-联系邮箱；phone-联系手机号；password-登录密码；department_id-所属部门ID；position_id-所属岗位ID；role_ids-角色ID数组；status-账号状态（1启用/0禁用）
      parameters:
      - description: 管理员ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新参数（可按需提交任意字段）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.AdminUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AdminDetailResponse'
        "403":
          description: 无权限或受保护管理员不能禁用
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: 管理员不存在
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 更新管理员信息
      tags:
      - 管理员管理
  /api/admin/admins/{id}/reset-google-auth:
    post:
      consumes:
      - application/json
      description: 强制清除指定管理员的谷歌验证码绑定
      parameters:
      - description: 要重置的管理员ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功
          schema:
            $ref: '#/definitions/apidoc.Success'
        "400":
          description: 参数错误或目标管理员未绑定2FA
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/apidoc.Error'
        "403":
          description: 无权限或不可操作受保护管理员
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: 管理员不存在
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 重置管理员的谷歌验证码
      tags:
      - 管理员管理
  /api/admin/admins/{id}/unbind-google-auth:
    post:
      consumes:
      - application/json
      description: 管理员解绑其他管理员的谷歌验证码
      parameters:
      - description: 要解绑的管理员ID
        in: path
        name: id
        required: true
        type: integer
      - description: 验证码确认参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.UnbindGoogleAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 解绑成功
          schema:
            $ref: '#/definitions/apidoc.Success'
        "400":
          description: 参数错误、验证码错误或目标管理员未绑定2FA
          schema:
            $ref: '#/definitions/apidoc.Error'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/apidoc.Error'
        "403":
          description: 当前管理员未绑定2FA，禁止执行
          schema:
            $ref: '#/definitions/apidoc.Error'
        "404":
          description: 管理员不存在
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 解绑管理员的谷歌验证码
      tags:
      - 管理员管理
  /api/admin/admins/export:
    post:
      consumes:
      - application/json
      description: 根据筛选条件导出管理员列表为CSV文件
      parameters:
      - description: 筛选（字段同列表 GET query）
        in: body
        name: request
        schema:
          $ref: '#/definitions/admin.AdminListFilter'
      produces:
      - application/json
      responses:
        "200":
          description: 导出成功，返回文件下载信息
          schema:
            $ref: '#/definitions/admin.AdminExportResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 导出管理员列表
      tags:
      - 管理员管理
  /api/admin/articles:
    get:
      consumes:
      - application/json
      description: 分页获取文章列表，支持按标题、状态、管理员等筛选
      parameters:
      - default: 1
        description: 页码（从1开始）
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量（建议 10-100）
        in: query
        name: page_size
        type: integer
      - description: 标题（模糊匹配）
        in: query
        name: title
        type: string
      - description: 内容（精确匹配）
        in: query
        name: content
        type: string
      - description: 状态（0-未发布，1-发布）
        enum:
        - "0"
        - "1"
        in: query
        name: status
        type: string
      - description: 管理员ID（精确匹配）
        in: query
        name: admin_id
        type: string
      - description: 创建时间（精确匹配）
        in: query
        name: created_at
        type: string
      - description: 更新时间（精确匹配）
        in: query
        name: updated_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ArticleListResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 获取文章列表
      tags:
      - 内容管理
    post:
      consumes:
      - application/json
      description: |-
        创建新的文章记录
        字段说明：title-文章标题（必填）；content-文章内容；status-发布状态（1发布/0未发布）；admin_id-发布管理员ID（必填）
      parameters:
      - description: 创建参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.ArticleCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ArticleDetailResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - 内容管理
  /api/admin/articles/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除文章
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ArticleDeleteResponse'
        "404":
          description: 记录不存在
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 删除文章
      tags:
      - 内容管理
    get:
      consumes:
      - application/json
      description: 根据ID获取文章详情
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ArticleDetailResponse'
        "404":
          description: 记录不存在
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 获取文章详情
      tags:
      - 内容管理
    put:
      consumes:
      - application/json
      description: |-
        根据ID更新文章信息
        字段说明：title-文章标题；content-文章内容；status-发布状态（1发布/0未发布）；admin_id-发布管理员ID（均为可选）
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.ArticleUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ArticleDetailResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/apidoc.Error'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 更新文章
      tags:
      - 内容管理
  /api/admin/blacklists:
    get:
      consumes:
      - application/json
      description: 分页获取黑名单，支持按IP、状态、时间区间筛选
      parameters:
      - default: 1
        description: 页码（从1开始）
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量（建议 10-100）
        in: query
        name: page_size
        type: integer
      - description: IP地址或IP段（模糊匹配）
        in: query
        name: ip
        type: string
      - description: 状态（1-启用，0-禁用）
        enum:
        - "0"
        - "1"
        in: query
        name: status
        type: string
      - description: 开始时间（格式：YYYY-MM-DD HH:mm:ss）
        in: query
        name: start_time
        type: string
      - description: 结束时间（格式：YYYY-MM-DD HH:mm:ss）
        in: query
        name: end_time
        type: string
      - description: 排序（格式：字段:asc/desc，例如：created_at:desc）
        in: query
        name: order_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.BlacklistListResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/apidoc.Error'
      security:
      - BearerAuth: []
      summary: 获取黑名单列表
      tags:
      - 风控管理
    post:
      consumes:
      - application/json
      description: |-
        创建黑名单记录，支持单个IP、CIDR、IP范围等格式
        字段说明：ip-IP地址/IP段（必填）；remark-备注；status-状态（1启用/0禁用）
      parameters:
      - description: 创建参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.BlacklistCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.BlacklistDetailResponse'
        "400":
